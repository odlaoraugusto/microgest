server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback para index.html - necessário para o roteamento client-side
    # do React Router (ex.: acessar /pacientes diretamente pela URL).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (JS/CSS gerados pelo Vite) podem ser
    # cacheados agressivamente pelo navegador.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
